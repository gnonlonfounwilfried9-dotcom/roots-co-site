name: Controles du site

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lancer les controles
        run: python scripts/verif.py
